name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || 'https://management-mdn.vercel.app' }}

      # Diagnostic : valide le token AVANT le déploiement.
      # Si cette étape échoue avec « Not able to load user … (404) »,
      # le secret GitHub `VERCEL_TOKEN` est invalide, expiré ou révoqué.
      # → Régénérer un token sur https://vercel.com/account/tokens et
      #   mettre à jour le secret dans GitHub → Settings → Secrets.
      - name: Validate Vercel token
        run: npx vercel@latest whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: Setup Vercel project configuration
        run: |
          mkdir -p .vercel
          cat << 'EOF' > .vercel/project.json
          {"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}
          EOF

      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}