name: Vercel Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Inspect Vercel projects and env vars
    runs-on: ubuntu-latest
    steps:
      - name: Whoami
        run: npx vercel@latest whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: List projects
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v3/projects?limit=100" | head -c 10000

      - name: Fix NEXTAUTH_URL env on Vercel project
        run: |
          HTTP_CODE=$(curl -s -o /tmp/patch_resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/prj_yc44KPMoEq3ULk15cPZhFgjQtlwk/env/rGcg8AoE5IqM1LPR?teamId=team_XZ59r2y4rZv6C07lnRVHgqrO" \
            -d '{"value": "https://benevol-mdn.vercel.app", "type": "sensitive", "target": ["production", "preview"]}')
          echo "HTTP $HTTP_CODE"
          cat /tmp/patch_resp.json
          if [ "$HTTP_CODE" != "200" ]; then exit 1; fi